[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "travelara"
version = "0.1.0"
description = "AI-powered travel planning engine"
readme = "README.md"
requires-python = "=3.11"

dependencies = [
    # API
    "fastapi>=0.115",
    "uvicorn>=0.30",

    # HTTP
    "httpx>=0.27",

    # Config
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",

    # ML
    "torch>=2.2",
    "transformers",
    "sentence-transformers",

    # Data
    "numpy>=2.1",
    "pandas",
    "scipy",
    "scikit-learn",
    "hdbscan",

    # Retrieval
    "rapidfuzz",
    "h3",

    # Utilities
    "pyyaml",
    "rich",
    "tqdm",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio",
    "pytest-cov",

    "ruff",

    "pyright",

    "ipython",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

[tool.pyright]
include = ["src"]
typeCheckingMode = "basic"
venvPath = "."
venv = ".leadscoring"